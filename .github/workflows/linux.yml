name: Linux CI

# On pull requests, and on default once they are merged into it. A
# branch with no pull request is not built
on:
  push:
    branches: [default]
  pull_request:

# A newer push to a pull request cancels the run it supersedes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# ccache keeps the compiled objects from one run to the next; meson uses
# it by itself when it is installed
env:
  CCACHE_DIR: ${{ github.workspace }}/ccache
  CCACHE_MAXSIZE: 500M

jobs:
  build:

    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v2
    - name: install-packages
      run: |
        sudo apt-get update
        sudo apt-get install build-essential libbz2-dev libfftw3-dev libfishsound1-dev libid3tag0-dev liblo-dev liblrdf0-dev libmad0-dev liboggz2-dev libopus-dev libopusfile-dev libpulse-dev libsamplerate0-dev libsndfile1-dev libsord-dev libxml2-utils portaudio19-dev qt6-base-dev qt6-pdf-dev qt6-base-dev-tools qt6-svg-dev raptor2-utils git mercurial autoconf automake libtool smlnj capnproto libcapnp-dev ninja-build libglib2.0-dev libboost-all-dev ccache
    - name: install-meson
      run: |
        mkdir -p tmp/meson
        cd tmp/meson
        wget https://github.com/mesonbuild/meson/releases/download/1.3.1/meson-1.3.1.tar.gz
        tar xvf meson-1.3.1.tar.gz
        sudo ln -sf $(pwd)/meson-1.3.1/meson.py /usr/bin/meson
    - name: install-rubberband
      run: |
        mkdir -p tmp/rubberband
        cd tmp/rubberband
        wget https://breakfastquay.com/files/releases/rubberband-3.3.0.tar.bz2
        tar xvjf rubberband-3.3.0.tar.bz2
        cd rubberband-3.3.0
        meson setup build --buildtype release
        ninja -C build
        sudo ninja -C build install
    - name: repoint
      run: ./repoint install
    # The libraries, about two thirds of the build, rarely change. A pull
    # request's run starts from its own last run's cache, or else from
    # default's last one
    - name: restore-ccache
      uses: actions/cache/restore@v4
      with:
        path: ccache
        key: ccache-linux-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: ccache-linux-
    - name: configure
      run: |
        meson setup build --buildtype release
        ccache -z
    - name: make
      run: |
        ninja -C build
        ccache -s
    # Saved as soon as the build is done, so that a failing test does not
    # lose it
    - name: save-ccache
      uses: actions/cache/save@v4
      with:
        path: ccache
        key: ccache-linux-${{ github.run_id }}-${{ github.run_attempt }}
    - name: test
      id: test
      run: meson test -C build --print-errorlogs --num-processes 1
    # meson shows at most the last 100 lines of a failing log, and one
    # test executable runs several QTest suites: name every failed test,
    # with the lines QTest indents under it (compared values, where it
    # failed) and the totals of each suite that failed
    - name: test-failures
      if: failure() && steps.test.outcome == 'failure'
      run: |
        awk '/^test:/ { print; next }
             /^Totals:/ { if ($0 !~ /, 0 failed/) print; next }
             /^(FAIL!|XPASS|QFATAL)|Received signal/ { print; fail = 1; next }
             /^[A-Z!]+ *: / { fail = 0 }
             fail && /^   / { print }' build/meson-logs/testlog.txt
