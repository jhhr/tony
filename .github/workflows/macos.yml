name: macOS CI

on: [push, pull_request]

jobs:
  build:

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v2
    - name: deps
      run: brew install smlnj qt6 meson ninja boost capnp mercurial
    - name: repoint
      run: PATH=$PATH:/usr/local/smlnj/bin ./repoint install
    - name: configure
      run: PATH=$PATH:/usr/local/opt/qt6/bin meson setup build --buildtype release
    - name: make
      run: ninja -C build
    - name: test
      id: test
      run: meson test -C build --print-errorlogs --num-processes 1
    # meson shows at most the last 100 lines of a failing log, and one
    # test executable runs several QTest suites: name every failed test,
    # with the lines QTest indents under it (compared values, where it
    # failed) and the totals of each suite that failed
    - name: test-failures
      if: failure() && steps.test.outcome == 'failure'
      run: |
        awk '/^test:/ { print; next }
             /^Totals:/ { if ($0 !~ /, 0 failed/) print; next }
             /^(FAIL!|XPASS|QFATAL)|Received signal/ { print; fail = 1; next }
             /^[A-Z!]+ *: / { fail = 0 }
             fail && /^   / { print }' build/meson-logs/testlog.txt
    - name: deploy-app
      run: |
        ls -lR /usr/local/opt
        QTDIR=/usr/local/opt/qt6 ./deploy/macos/deploy.sh "Tony"
    - name: check
      run: |
        otool -L ./"Tony.app/Contents/MacOS/Tony"
        ./"Tony.app/Contents/MacOS/Tony" --version
