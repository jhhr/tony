name: macOS CI

# On pull requests, and on default once they are merged into it. A
# branch with no pull request is not built
on:
  push:
    branches: [default]
  pull_request:

# A newer push to a pull request cancels the run it supersedes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# ccache keeps the compiled objects from one run to the next; meson uses
# it by itself when it is installed
env:
  CCACHE_DIR: ${{ github.workspace }}/ccache
  CCACHE_MAXSIZE: 500M

jobs:
  build:

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v2
    - name: deps
      run: brew install smlnj qt6 meson ninja boost capnp mercurial ccache
    - name: repoint
      run: PATH=$PATH:/usr/local/smlnj/bin ./repoint install
    # The libraries, about two thirds of the build, rarely change. A pull
    # request's run starts from its own last run's cache, or else from
    # default's last one
    - name: restore-ccache
      uses: actions/cache/restore@v4
      with:
        path: ccache
        key: ccache-macos-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: ccache-macos-
    - name: configure
      run: |
        PATH=$PATH:/usr/local/opt/qt6/bin meson setup build --buildtype release
        ccache -z
    - name: make
      run: |
        ninja -C build
        ccache -s
    # Saved as soon as the build is done, so that a failing test does not
    # lose it
    - name: save-ccache
      uses: actions/cache/save@v4
      with:
        path: ccache
        key: ccache-macos-${{ github.run_id }}-${{ github.run_attempt }}
    - name: test
      id: test
      run: meson test -C build --print-errorlogs --num-processes 1
    # meson shows at most the last 100 lines of a failing log, and one
    # test executable runs several QTest suites: name every failed test,
    # with the lines QTest indents under it (compared values, where it
    # failed) and the totals of each suite that failed
    - name: test-failures
      if: failure() && steps.test.outcome == 'failure'
      run: |
        awk '/^test:/ { print; next }
             /^Totals:/ { if ($0 !~ /, 0 failed/) print; next }
             /^(FAIL!|XPASS|QFATAL)|Received signal/ { print; fail = 1; next }
             /^[A-Z!]+ *: / { fail = 0 }
             fail && /^   / { print }' build/meson-logs/testlog.txt
    # No app bundle: the packaging scripts in deploy/osx are qmake's,
    # and this build makes none. The app it does build has to start
    - name: check
      run: |
        otool -L build/tony
        build/tony --version
