name: Windows CI

on: [push, pull_request]

# Built as it is on the development machine (docs/building.md): MSYS2's
# mingw64 toolchain, Qt and libraries, with meson and ninja

jobs:
  build:

    runs-on: windows-2022

    steps:
    - uses: actions/checkout@v3
    - uses: ProjectSavanna/setup-sml@v1.2.0
      with:
        smlnj-version: '110.99.4'

    # repoint checks six of the libraries out with Mercurial
    - name: mercurial
      run: if (-not (Get-Command hg -ErrorAction SilentlyContinue)) { pip install mercurial }

    - name: repoint
      run: ./repoint install

    - uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-meson
          mingw-w64-x86_64-ninja
          mingw-w64-x86_64-pkgconf
          mingw-w64-x86_64-qt6-base
          mingw-w64-x86_64-qt6-svg
          mingw-w64-x86_64-boost
          mingw-w64-x86_64-bzip2
          mingw-w64-x86_64-zlib
          mingw-w64-x86_64-fftw
          mingw-w64-x86_64-libsamplerate
          mingw-w64-x86_64-rubberband
          mingw-w64-x86_64-libsndfile
          mingw-w64-x86_64-flac
          mingw-w64-x86_64-libogg
          mingw-w64-x86_64-libvorbis
          mingw-w64-x86_64-opus
          mingw-w64-x86_64-opusfile
          mingw-w64-x86_64-libmad
          mingw-w64-x86_64-libid3tag
          mingw-w64-x86_64-portaudio
          mingw-w64-x86_64-serd
          mingw-w64-x86_64-sord

    # meson.build reads MINGW_PREFIX, which an MSYS2 shell sets to the
    # POSIX path /mingw64: gcc wants the Windows one. Every step sets it,
    # as ninja may run meson again
    - name: configure
      shell: msys2 {0}
      run: |
        export MINGW_PREFIX=$(cygpath -m /mingw64)
        meson setup build --buildtype release

    - name: make
      shell: msys2 {0}
      run: |
        export MINGW_PREFIX=$(cygpath -m /mingw64)
        ninja -C build

    # Tony's suites also write their results to files: here QTest's
    # output to stdout does not reach meson's log
    - name: test
      id: test
      shell: msys2 {0}
      run: |
        export MINGW_PREFIX=$(cygpath -m /mingw64)
        mkdir -p build/test-results
        export TONY_TEST_LOG_DIR=$(cygpath -m "$PWD/build/test-results")
        meson test -C build --print-errorlogs --num-processes 1
    # meson shows at most the last 100 lines of a failing log, and one
    # test executable runs several QTest suites: name every failed test,
    # with the lines QTest indents under it (compared values, where it
    # failed) and the totals of each suite that failed
    - name: test-failures
      if: failure() && steps.test.outcome == 'failure'
      shell: msys2 {0}
      run: |
        awk '/^test:/ { print; next }
             /^Totals:/ { if ($0 !~ /, 0 failed/) print; next }
             /^(FAIL!|XPASS|QFATAL)|Received signal/ { print; fail = 1; next }
             /^[A-Z!]+ *: / { fail = 0 }
             fail && /^   / { print }' build/meson-logs/testlog.txt
        awk 'function show(line) {
                 if (!shown) { print "suite: " FILENAME; shown = 1 }
                 print line
             }
             FNR == 1 { shown = 0; fail = 0 }
             /^Totals:/ { if ($0 !~ /, 0 failed/) show($0); next }
             /^(FAIL!|XPASS|QFATAL)/ { show($0); fail = 1; next }
             /^[A-Z!]+ *: / { fail = 0 }
             fail && /^   / { show($0) }' build/test-results/*.txt
