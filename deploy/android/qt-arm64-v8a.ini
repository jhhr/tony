# Meson cross file for Tony's Android build (arm64-v8a): where Qt for
# Android is. It goes on top of the NDK cross file that
# deploy/android/build-deps.sh writes, as deploy/android/build-tony.sh
# does:
#
#   meson setup build-android \
#       --cross-file /opt/android/cross-arm64-v8a.ini \
#       --cross-file deploy/android/qt-arm64-v8a.ini
#
# Qt for Android installs no pkg-config files, so meson finds it through
# this qmake, Qt's wrapper for the target. meson then takes moc, rcc and
# uic from the QT_HOST_LIBEXECS that qmake reports, which is the host
# Qt's libexec/, built by deploy/android/build-qt.sh with the same
# version.

[binaries]
qmake6 = '/opt/android/qt/6.11.2/android_arm64_v8a/bin/qmake'
